<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Citypass Sacramento: explore os pontos turísticos da cidade com o assistente.">
    <meta name="theme-color" content="#24381f">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <title>Citypass Sacramento</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- Sprite de icones (unicos usados na interface) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="i-leaf" viewBox="0 0 24 24">
            <path d="M20 4C11 5 5 11 4 20c9-1 15-7 16-16Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M5 19C9 15 14 10 18 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </symbol>
        <symbol id="i-chev-left" viewBox="0 0 24 24">
            <path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
        <symbol id="i-chev-right" viewBox="0 0 24 24">
            <path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
    </svg>

    <!-- Tela 1: boas-vindas -->
    <section id="welcomeScreen" class="screen" role="dialog" aria-modal="true" aria-label="Boas-vindas / Welcome">
        <div class="welcome-card glass-strong">
            <div class="welcome-ico">
                <svg class="ico-xl"><use href="#i-leaf"/></svg>
            </div>
            <a class="presence" href="ia.html">
                <span class="status-dot"></span>
                <span class="badge-text">IA online</span>
            </a>
            <h2 class="welcome-title">Citypass Sacramento</h2>
            <p id="welcomeSub" class="welcome-sub">Seu assistente local em Sacramento - MG</p>
            <p id="welcomeDesc" class="welcome-desc">Explore a Gruta dos Palhares, o Desemboque, a Basílica, as Cachoeiras, o Colégio Allan Kardec e as Personalidades de Sacramento.</p>
            <div id="langGrid" class="lang-grid" role="group" aria-label="Idioma / Language">
                <button type="button" class="lang-btn" data-lang="pt">Português</button>
                <button type="button" class="lang-btn" data-lang="en">English</button>
                <button type="button" class="lang-btn" data-lang="es">Español</button>
                <button type="button" class="lang-btn" data-lang="fr">Français</button>
            </div>
            <button id="startBtn" type="button" class="start-btn">Começar</button>
        </div>
    </section>

    <!-- Tela 2: menu de temas -->
    <section id="menuScreen" class="screen hidden" aria-label="Temas">
        <header class="topbar">
            <span class="brand">
                <svg class="ico"><use href="#i-leaf"/></svg>
                <span class="brand-name">Citypass Sacramento</span>
            </span>
            <a class="presence" href="ia.html">
                <span class="status-dot"></span>
                <span class="badge-text">IA online</span>
            </a>
        </header>
        <div class="menu-body">
            <p id="temasLabel" class="eyebrow">Escolha um tema para explorar</p>
            <div id="themeList" class="theme-list"></div>
        </div>
    </section>

    <!-- Tela 3: leitura (texto + decisao) -->
    <section id="readerScreen" class="screen hidden">
        <header class="topbar">
            <button id="backBtn" type="button" class="back-btn">
                <svg class="ico"><use href="#i-chev-left"/></svg>
                <span id="backLabel">Menu</span>
            </button>
            <a class="presence" href="ia.html">
                <span class="status-dot"></span>
                <span class="badge-text">IA online</span>
            </a>
        </header>
        <main id="readerMain" class="reader">
            <div id="thinkingRow" class="thinking hidden">
                <span class="dots"><span></span><span></span><span></span></span>
                <span id="thinkingPhase">Pensando...</span>
            </div>
            <article id="answerCard" class="answer glass-strong hidden">
                <div id="answerBody" aria-live="polite"></div>
            </article>
        </main>
        <footer id="optionsBar" class="options-bar" aria-label="Opções"></footer>
    </section>

    <script src="assets/js/nos-data.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
