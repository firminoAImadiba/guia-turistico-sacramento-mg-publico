<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="Guia Virtual de Sacramento - MG (versão público): explore pontos turísticos tocando em opções, sem digitar.">
    <meta name="theme-color" content="#375734">
    <title>Guia Virtual de Sacramento - MG (Público)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23478a3f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="animated-gradient relative overflow-hidden w-full max-w-full">
    <!-- Sprite de ícones SVG (inline para funcionar também via file://) -->
    <svg xmlns="http://www.w3.org/2000/svg" class="hidden" aria-hidden="true">
        <defs>
            <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
                <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
            </symbol>
            <symbol id="i-mountain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
            </symbol>
            <symbol id="i-landmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>
            </symbol>
            <symbol id="i-waves" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
            </symbol>
            <symbol id="i-church" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v4"/><path d="M8 4h8"/><path d="M12 6l7 3v13H5V9l7-3z"/><path d="M9 22v-5h6v5"/>
            </symbol>
            <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </symbol>
            <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </symbol>
            <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>
            </symbol>
        </defs>
    </svg>

    <!-- Fundo ambiente -->
    <div class="fixed inset-0 pointer-events-none z-0" aria-hidden="true">
        <div class="blob-bg w-96 h-96 top-1/4 left-1/4" style="background: rgba(71,138,63,0.5); animation-delay: 0s;"></div>
        <div class="blob-bg w-72 h-72 top-1/2 right-1/4" style="background: rgba(55,87,52,0.7); animation-delay: -5s;"></div>
        <div class="blob-bg w-64 h-64 bottom-1/4 left-1/2" style="background: rgba(139,227,129,0.35); animation-delay: -10s;"></div>
        <div class="blob-bg w-80 h-80 top-1/3 right-1/3" style="background: rgba(71,138,63,0.4); animation-delay: -15s;"></div>
        <div class="blob-bg w-56 h-56 bottom-1/3 left-1/3" style="background: rgba(120,125,120,0.35); animation-delay: -7s;"></div>
    </div>

    <div class="fixed inset-0 pointer-events-none z-0 opacity-5" aria-hidden="true" style="background-image: url('data:image/svg+xml,<svg viewBox=\"0 0 256 256\" xmlns=\"http://www.w3.org/2000/svg\"><filter id=\"noise\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.9\" numOctaves=\"4\" stitchTiles=\"stitch\"/></filter><rect width=\"100%\" height=\"100%\" filter=\"url(%23noise)\"/></svg>');"></div>

    <main class="relative z-10 flex flex-col overflow-hidden w-full max-w-full">
        <!-- Cabeçalho -->
        <div class="px-4 pt-4 sm:px-6 lg:px-8 sm:pt-5 flex-shrink-0">
            <header class="glass-strong max-w-2xl mx-auto w-full px-4 py-4 sm:px-6 rounded-3xl">
                <div class="text-center sm:text-left">
                    <h1 class="text-xl sm:text-3xl font-bold text-white leading-tight flex items-center justify-center sm:justify-start gap-2">
                        <svg class="icon-lg" style="color: #8be381;"><use href="#i-leaf"/></svg>
                        Guia Virtual de Sacramento
                    </h1>
                    <p class="text-sm sm:text-base mt-1" style="color: rgba(139,227,129,0.8);">Versão interativa para o público — toque nas opções, sem digitar</p>
                </div>
            </header>
        </div>

        <!-- Temas (atalhos viram seletor de corrente) -->
        <section class="px-4 py-3 sm:px-6 lg:px-8 flex-shrink-0" aria-label="Temas">
            <div class="max-w-2xl mx-auto w-full min-w-0">
                <div class="glass-strong rounded-2xl p-4 shadow-xl">
                    <p class="text-xs font-semibold uppercase tracking-wider mb-3" style="color: rgba(139,227,129,0.7);">Escolha um tema para explorar</p>
                    <div class="flex gap-3 overflow-x-auto scrollbar-hide" id="shortcutsContainer">
                        <button class="btn-shortcut glass px-4 py-2.5 rounded-xl whitespace-nowrap text-sm text-white flex items-center gap-2 shadow-md" data-tema="gruta">
                            <svg class="icon" style="color: #8be381;"><use href="#i-mountain"/></svg>
                            <span>Gruta dos Palhares</span>
                        </button>
                        <button class="btn-shortcut glass px-4 py-2.5 rounded-xl whitespace-nowrap text-sm text-white flex items-center gap-2 shadow-md" data-tema="desemboque">
                            <svg class="icon" style="color: #8be381;"><use href="#i-landmark"/></svg>
                            <span>Desemboque</span>
                        </button>
                        <button class="btn-shortcut glass px-4 py-2.5 rounded-xl whitespace-nowrap text-sm text-white flex items-center gap-2 shadow-md" data-tema="basilica">
                            <svg class="icon" style="color: #8be381;"><use href="#i-church"/></svg>
                            <span>Basílica</span>
                        </button>
                        <button class="btn-shortcut glass px-4 py-2.5 rounded-xl whitespace-nowrap text-sm text-white flex items-center gap-2 shadow-md" data-tema="cachoeiras">
                            <svg class="icon" style="color: #8be381;"><use href="#i-waves"/></svg>
                            <span>Cachoeiras</span>
                        </button>
                        <button class="btn-shortcut glass px-4 py-2.5 rounded-xl whitespace-nowrap text-sm text-white flex items-center gap-2 shadow-md" data-tema="colegio">
                            <svg class="icon" style="color: #8be381;"><use href="#i-book"/></svg>
                            <span>Colégio Allan Kardec</span>
                        </button>
                        <button class="btn-shortcut glass px-4 py-2.5 rounded-xl whitespace-nowrap text-sm text-white flex items-center gap-2 shadow-md" data-tema="personalidades">
                            <svg class="icon" style="color: #8be381;"><use href="#i-user"/></svg>
                            <span>Personalidades</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Área de chat -->
        <section class="flex-1 min-h-0 px-4 py-3 sm:px-6 lg:px-8 overflow-hidden" aria-label="Conversa">
            <div class="max-w-2xl mx-auto w-full glass-strong rounded-3xl shadow-2xl flex flex-col overflow-hidden h-full min-h-0">
                <div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden p-4 space-y-4 chat-scroll" id="messagesContainer" role="log" aria-live="polite" aria-label="Conversa com o guia"></div>

                <div id="typingIndicator" class="hidden px-4 pb-4 items-start gap-3" data-sender="guide">
                    <div class="w-9 h-9 rounded-2xl glass flex items-center justify-center flex-shrink-0 shadow-lg">
                        <svg class="icon-lg" style="color: #8be381;"><use href="#i-leaf"/></svg>
                    </div>
                    <div class="bubble-guide px-4 py-3 rounded-2xl rounded-tl-sm">
                        <p class="ai-phase mb-1" id="typingPhase">Consultando acervo local...</p>
                        <div class="typing-indicator flex items-center gap-1">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Opções da corrente (substitui a caixa de texto) -->
        <section class="px-4 pt-2 sm:px-6 lg:px-8 flex-shrink-0 w-full safe-bottom" aria-label="Opções">
            <div class="max-w-2xl mx-auto w-full min-w-0">
                <div class="glass-strong rounded-2xl shadow-xl p-3">
                    <p class="text-xs font-semibold uppercase tracking-wider mb-2 px-1" style="color: rgba(139,227,129,0.7);">Toque em uma opção para continuar</p>
                    <div id="optionsContainer" role="group" aria-label="Opções de resposta"></div>
                    <p class="text-xs mt-2 px-1" style="color: rgba(220,235,220,0.85);">Guia local automático — 6 temas, 216 pontos de conversa, sem digitação.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/nos-data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
